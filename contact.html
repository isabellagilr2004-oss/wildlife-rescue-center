    <div class="tab-desk">
        <a href="index.html">
            <img src="images/baby-hawk-banner.jpg" alt="rescued baby hawk">
        </a>

<nav>

<main>

    <h2>Contact Us</h2>

    <p>
        Have a question or need help with wildlife? Send us a message.
    </p>

    <form>

        <fieldset>

            <legend>Contact Information</legend>

            <label for="name">Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                required
            >

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="reason">Reason for Contact:</label>

            <select id="reason" name="reason">
                <option value="wildlife">Wildlife Help</option>
                <option value="volunteer">Volunteering</option>
                <option value="donation">Donation</option>
                <option value="partnership">Partnership</option>
                <option value="other">Other</option>
            </select>

            <label for="message">Message:</label>

            <textarea
                id="message"
                name="message"
                rows="6"
                required
            ></textarea>

            <input type="submit" value="Submit">

        </fieldset>

    </form>

</main>
